<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUVERSE - Student Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #171044, #5636a8, #1677a8);
    color: white;
}

.login-box {
    width: 100%;
    max-width: 420px;
    padding: 38px 30px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #ddd5ff;
    margin-bottom: 30px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: white;
    outline: none;
    font-size: 15px;
}

input::placeholder {
    color: #ddd;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 24px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff65a3, #8b65ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #ddd5ff;
    font-size: 13px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: white;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">EDUVERSE</div>
    <p class="subtitle">Learn Without Limits</p>

    <h2>Student Login</h2>

    <form id="loginForm">

    <label>Email Address</label>
    <input type="email" id="email"
           placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" id="password"
           placeholder="Enter your password" required>

    <p>
    <a href="#" id="forgotPassword">Forgot Password?</a>
</p>

    <p id="message"></p>

</form>

    <div class="footer">
        Your Learning Journey Starts Here
    </div>

    <a class="back" href="index.html">← Back to Home</a>

</div>

<script type="module">
import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Signing in...";

    try {
    const result = await signInWithEmailAndPassword(
        auth, email, password
    );

    if (!result.user.emailVerified) {
        await signOut(auth);
        message.textContent =
            "Please verify your email before signing in.";
        return;
    }

    window.location.href = "dashboard.html";

} catch (error) {
        message.textContent = "Login failed. Check your email and password.";
    }
});

const forgotPassword = document.getElementById("forgotPassword");

forgotPassword.addEventListener("click", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
        message.textContent = "Please enter your email address first.";
        return;
    }

    try {
        await sendPasswordResetEmail(auth, email);
        message.textContent =
            "Password reset link sent! Please check your email.";
    } catch (error) {
        message.textContent =
            "Unable to send reset email. Please check your email address.";
    }
});
  
</script>
  
</body>
</html>
